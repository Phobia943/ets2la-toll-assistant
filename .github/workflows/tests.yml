name: Core tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run independent controller tests
        run: dotnet run --project CoreTests -c Release
  recording-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check recording analysis without a running game
        shell: pwsh
        run: ./Tools/Test-TollRecording.ps1
      - name: Check historical evidence inventory
        run: python -m unittest discover -s Tools -p test_toll_history.py
      - name: Check input recording layout and recovery without live channels
        run: python Tools/InputBridge/TestRecord.py
      - name: Check optional pedal observer decoding without live channels
        run: python Tools/InputBridge/TestPedalProbe.py
  geometry-protocol:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Download pinned Zig compiler and official SDK headers
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $zip=Join-Path $env:RUNNER_TEMP 'zig.zip'
          Invoke-WebRequest 'https://ziglang.org/download/0.15.2/zig-x86_64-windows-0.15.2.zip' -OutFile $zip
          if((Get-FileHash $zip).Hash -ne '3A0ED1E8799A2F8CE2A6E6290A9FF22E6906F8227865911FB7DDEDC3CC14CB0C') {throw 'Zig hash mismatch'}
          Expand-Archive -LiteralPath $zip -DestinationPath $env:RUNNER_TEMP
          ./Native/TruckersMPGeometry/Fetch-Sdk.ps1
      - name: Build observer and run fake SDK host
        shell: pwsh
        run: ./Native/TruckersMPGeometry/Build.ps1 -Zig "$env:RUNNER_TEMP/zig-x86_64-windows-0.15.2/zig.exe" -Test
      - name: Check optional pedal write observation on isolated mappings
        shell: pwsh
        run: |
          ./Native/PedalProbe/Test.ps1 -Zig "$env:RUNNER_TEMP/zig-x86_64-windows-0.15.2/zig.exe" -OutputDirectory (Join-Path $env:RUNNER_TEMP 'pedal-probe-tests')
          python Tools/InputBridge/TestPedalProbe.py (Join-Path $env:RUNNER_TEMP 'pedal-probe-tests/fixture.bin')
      - name: Decode actual native ABI fixture in managed tests
        shell: pwsh
        run: |
          $env:MAUT_GEOMETRY_FIXTURE=(Resolve-Path './Native/TruckersMPGeometry/bin/native-fixture.bin').Path
          dotnet run --project CoreTests -c Release
      - name: Check compatible input bridge with an isolated fake game
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $sdk=Join-Path $env:RUNNER_TEMP 'scs-sdk-1.16.zip'
          Invoke-WebRequest 'https://download.eurotrucksimulator2.com/scs_sdk_1_16.zip' -OutFile $sdk
          if((Get-FileHash -LiteralPath $sdk).Hash -ne '49821E25568F4D7E462135F577F8FEF2AB197326404F2C1DAEF139B8F3DC5E69'){throw 'SCS SDK hash mismatch'}
          ./Tools/InputBridge/Build.ps1 -Zig "$env:RUNNER_TEMP/zig-x86_64-windows-0.15.2/zig.exe" -SdkArchive $sdk -CacheDirectory (Join-Path $env:RUNNER_TEMP 'input-cache') -Test
      - name: Check parked-scene collector and producer contracts without a game
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $archive=Join-Path $env:RUNNER_TEMP 'maut-scene-sdk.zip'
          Invoke-WebRequest 'https://github.com/ETS2LA/plugin/archive/31f1cf1406d03f0d647a10c72887eaab5c2a748e.zip' -OutFile $archive
          if((Get-FileHash -LiteralPath $archive).Hash -ne 'D3B13C1904BEF44BAFE8009DB500579A5B473E63F8D99B1143D4F829143E2716'){throw 'Scene SDK archive hash mismatch'}
          $sourceRoot=Join-Path $env:RUNNER_TEMP 'maut-scene-sdk'
          Expand-Archive -LiteralPath $archive -DestinationPath $sourceRoot
          ./Native/ParkedScene/Test-SceneSdk.ps1 -SdkSource (Join-Path $sourceRoot 'plugin-31f1cf1406d03f0d647a10c72887eaab5c2a748e') -Zig "$env:RUNNER_TEMP/zig-x86_64-windows-0.15.2/zig.exe" -TestDirectory (Join-Path $env:RUNNER_TEMP 'maut-scene-tests')
